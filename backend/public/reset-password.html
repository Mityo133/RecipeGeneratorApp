<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.3);
      --accent-hover: #9d8fff;
      --text: #e8e6f0;
      --muted: #6b6880;
      --success: #4ade80;
      --error: #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .bg-orb-1 {
      width: 500px; height: 500px;
      background: var(--accent);
      top: -150px; left: -100px;
      animation-delay: 0s;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: #a06af7;
      bottom: -100px; right: -100px;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 0 1px rgba(124,106,247,0.1), 0 32px 80px rgba(0,0,0,0.6);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), #a06af7);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .lock-icon svg { width: 28px; height: 28px; fill: white; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .input-wrap {
      position: relative;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.85rem 3rem 0.85rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: var(--text); }
    .toggle-pass svg { width: 18px; height: 18px; }

    /* Password strength */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-bar span {
      height: 3px;
      flex: 1;
      border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      min-height: 16px;
      transition: color 0.3s;
    }

    button.submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--accent), #a06af7);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px var(--accent-glow);
      letter-spacing: 0.02em;
    }
    button.submit-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }
    button.submit-btn:active { transform: translateY(0); }
    button.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .message {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .message.success {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--success);
    }
    .message.error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--error);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.875rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .back-link svg { width: 14px; height: 14px; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </div>

    <h1>Reset Password</h1>
    <p class="subtitle">Choose a strong new password for your account.</p>

    <div class="field">
      <label>New Password</label>
      <div class="input-wrap">
        <input type="password" id="newPassword" placeholder="Enter new password" oninput="checkStrength(this.value)" />
        <button class="toggle-pass" onclick="toggleVisibility('newPassword', this)" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
      <div class="strength-bar">
        <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" placeholder="Confirm new password" />
        <button class="toggle-pass" onclick="toggleVisibility('confirmPassword', this)" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="resetPassword()">Update Password</button>

    <div class="message" id="message"></div>

    <div class="divider"></div>

    <a href="/" class="back-link">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to login
    </a>
  </div>

  <script>
    // Extract tokens from the URL hash Supabase appends after clicking the email link
    const hash = window.location.hash;
    const params = new URLSearchParams(hash.substring(1));
    const accessToken  = params.get('access_token');
    const refreshToken = params.get('refresh_token');

    // Guard: disable the form if the link is missing tokens
    if (!accessToken || !refreshToken) {
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('submitBtn').disabled = true;
        showMessage('Invalid or expired reset link. Please request a new password reset email.', 'error');
      });
    }

    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId)
      input.type = input.type === 'password' ? 'text' : 'password'
    }

    function checkStrength(password) {
      const bars = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')]
      const label = document.getElementById('strengthLabel')

      const checks = [
        password.length >= 6,
        password.length >= 10,
        /[A-Z]/.test(password) && /[0-9]/.test(password),
        /[^A-Za-z0-9]/.test(password)
      ]

      const score = checks.filter(Boolean).length
      const colors = ['#f87171', '#fb923c', '#facc15', '#4ade80']
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong']
      const labelColors = ['', '#f87171', '#fb923c', '#facc15', '#4ade80']

      bars.forEach((bar, i) => {
        bar.style.background = i < score ? colors[score - 1] : 'var(--border)'
      })

      label.textContent = password.length > 0 ? labels[score] : ''
      label.style.color = labelColors[score]
    }

    async function resetPassword() {
      const newPassword = document.getElementById('newPassword').value
      const confirmPassword = document.getElementById('confirmPassword').value
      const messageEl = document.getElementById('message')
      const btn = document.getElementById('submitBtn')

      messageEl.style.display = 'none'

      if (!newPassword || !confirmPassword) {
        showMessage('Please fill in both password fields.', 'error')
        return
      }

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match.', 'error')
        return
      }

      if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error')
        return
      }

      btn.disabled = true
      btn.innerHTML = '<span class="spinner"></span>Updating...'

      try {
        const result = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken, refreshToken, newPassword })
        })

        const data = await result.json()

        if (!result.ok) {
          showMessage(data.error || 'Something went wrong.', 'error')
          btn.disabled = false
          btn.textContent = 'Update Password'
          return
        }

        showMessage('Password updated! Redirecting...', 'success')
        setTimeout(() => window.location.href = '/', 2000)

      } catch (err) {
        showMessage('Network error. Please try again.', 'error')
        btn.disabled = false
        btn.textContent = 'Update Password'
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById('message')
      el.textContent = text
      el.className = `message ${type}`
      el.style.display = 'block'
    }
  </script>
</body>
</html>
```
